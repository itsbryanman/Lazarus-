[package]
name = "lazarus-recovery"
version = "0.1.0"
edition = "2024"

[lib]
name = "lazarus_recovery"
path = "src/lib.rs"

[[bin]]
name = "lazarus-recovery"
path = "src/main.rs"

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
lazarus-core = { path = "../lazarus-core" }
lazarus-cli = { path = "../lazarus-cli" }
tokio = { version = "1.48.0", features = ["fs", "process", "time", "macros", "rt-multi-thread", "io-util", "sync"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sysinfo = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
