[package]
name = "lazarus-core"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.10.3"
argon2 = "0.5"
async-trait = "0.1.89"
aws-config = "1.1.7"
aws-sdk-s3 = "1.17.0"
blake3 = "1.8.2"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ssh2 = "0.9"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
zstd = "0.13.3"
