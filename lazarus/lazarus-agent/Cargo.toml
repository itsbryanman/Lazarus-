[package]
name = "lazarus-agent"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "lazarus-agent"
path = "src/main.rs"

[dependencies]
lazarus-core = { path = "../lazarus-core" }
lazarus-common = { path = "../lazarus-common" }
tokio = { version = "1.48.0", features = ["full"] }
tokio-stream = "0.1"
tonic = "0.12"
uuid = { version = "1.11", features = ["v4"] }
blake3 = "1.8.2"
zstd = "0.13.3"
clap = { version = "4.5.50", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
dirs = "5.0"
tracing = "0.1"
tracing-subscriber = "0.3"
hostname = "0.4"
chrono = "0.4"
filetime = "0.2"
libc = "0.2"
